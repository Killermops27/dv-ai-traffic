; =============================================================================
;  Derail Valley AI Traffic - Advanced Configuration File
;  Location: Mods/AITraffic/settings.ini
;  Settings in this file override defaults and can be reloaded in real time.
; =============================================================================

[Physics]
; Proportional gain for throttle PID controller (default: 0.08)
ThrottleKp = 0.0800
; Integral gain for throttle PID controller (default: 0.02)
ThrottleKi = 0.0200
; Derivative gain for throttle PID controller (default: 0.04)
ThrottleKd = 0.0400
; Proportional gain for train brake PID controller (default: 0.14)
BrakeKp = 0.1400
; Integral gain for train brake PID controller (default: 0.02)
BrakeKi = 0.0200
; Derivative gain for train brake PID controller (default: 0.05)
BrakeKd = 0.0500
; Service braking curve deceleration multiplier (default: 1.0)
DecelerationMultiplier = 1.00
; Service deceleration multiplier applied during rain/wet track conditions (default: 0.60)
WetDecelerationMultiplier = 0.60
; Active Wheel Slide Protection (WSP / anti-skid brake venting and auto-sanding) (default: true)
EnableWheelSlideProtection = true
; Maximum service train brake pipe reduction in wet weather without sand (default: 0.55)
MaxWetServiceBrakeDemand = 0.55
; Minimum traction authority floor during active wheel slip (0.20 to 0.80, default: 0.60)
SlipCutFactor = 0.60
; Maximum allowed speed when climbing steep uphill grades in km/h (default: 40.0)
MaxGradeClimbSpeedKmh = 40.0
; Maximum allowed speed when descending steep downhill grades in km/h (default: 30.0)
MaxGradeDescendSpeedKmh = 30.0
; Independent/train brake holding duration in seconds during hill starts (default: 3.0)
HillStartBrakeHoldSeconds = 3.0

[Dispatcher]
; Inactivity timeout before stuck/deadlocked AI train emergency despawn in seconds (default: 300.0)
DeadlockTimeoutSeconds = 300.0
; Switch blade safety margin in meters around movable switch points (default: 7.0)
SwitchBladeZoneMeters = 7.0
; Clearance buffer in meters required beyond consist length for siding reservation (default: 25.0)
SidingClearanceBufferMeters = 25.0
; Station procedural job generation wake-up inner radius in meters (default: 1200.0)
StationWakeUpRadius = 1200.0
; Station outer hysteresis radius for job protection and clean reset in meters (default: 1600.0)
StationOuterRadius = 1600.0

[Economy]
; Flat base fee for hiring an AI driver in dollars (default: 300.00)
DriverBaseFee = 300.00
; Distance rate per route meter in dollars ($0.06/m = $60/km, default: 0.06)
PerMeterRate = 0.0600
; Mass surcharge per ton of consist weight in dollars ($0.35/ton = $35/100t, default: 0.35)
PerTonRate = 0.3500

[Consists]
; Minimum number of cars for freight consists (default: 3)
MinCars = 3
; Maximum number of cars for freight consists (default: 20)
MaxCars = 20
; Relative engine spawning selection weights (0.0 to 1.0)
WeightDE2 = 1.00
WeightDH4 = 1.00
WeightDE6 = 0.80
WeightDM3 = 0.60
WeightS060 = 0.40
WeightS282 = 0.30

[Lighting]
; Headlight operating mode: Automatic, AlwaysHigh, AlwaysLow, Off (default: Automatic)
Mode = Automatic
; Attach End-of-Train (EOT) marker lantern to rear freight cars and caboose (default: true)
EOTMarker = true
; EOT marker flash mode: true for ~1 Hz flashing, false for steady red light (default: true)
EOTMarkerFlashing = true
; EOT flash frequency in Hertz (default: 1.0)
EOTFlashRateHz = 1.0
; Enable locomotive cab interior backlights and dome light at night (default: true)
CabLightingAtNight = true
